<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk Cireng LSS</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff8ef;
  color: #4b2e20;
}
.produk {
  max-width: 1100px;
  margin: auto;
  padding: 60px 20px;
  text-align: center;
}
h1 { font-size: 40px; margin-bottom: 10px; }
.subtitle { color:#806657; margin-bottom:30px; }
.gambar-produk {
  width: 100%;
  max-width: 850px;
  display: block;
  margin: 0 auto 30px;
  border-radius: 24px;
  box-shadow: 0 10px 30px rgba(0,0,0,.12);
}
.best {
  max-width: 650px;
  margin: 0 auto 35px;
  padding: 22px;
  background: #fff;
  border: 2px dashed #ef7d32;
  border-radius: 20px;
}
.badge {
  display:inline-block;
  background:#ef7d32;
  color:white;
  padding:7px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}
.cards {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
}
.card {
  background:white;
  padding:22px;
  border-radius:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.07);
}
.card h3 { margin:8px 0; }
.card p { color:#806657; line-height:1.5; font-size:14px; }
.price { font-weight:bold; color:#c45c27; }
</style>
</head>
<body>
<section class="produk">
  <h1>🍽️ Cireng Isi LSS</h1>
  <p class="subtitle">Gurih, chewy, dan punya banyak pilihan rasa!</p>
